<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Магазин канцтоваров</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
    <div class="logo">
        <a th:href="@{/}">🛒 Магазин канцтоваров</a>
    </div>

    <nav class="main-nav">
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/catalog}">Каталог</a>
        <a th:href="@{/about}">О магазине</a>

        <!-- Управление товарами только для админа/менеджера -->
        <span sec:authorize="hasAnyRole('Администратор', 'Менеджер')">
            <a th:href="@{/admin/products}">Управление товарами</a>
            <a th:href="@{/admin/products/new}">Добавить товар</a>
        </span>

        <!-- Мои заказы для авторизованных -->
        <a sec:authorize="isAuthenticated()" th:href="@{/orders}">Мои заказы</a>

        <!-- Админ-панель -->
        <a sec:authorize="hasAnyRole('Администратор', 'Менеджер')" th:href="@{/admin}">Админ-панель</a>
    </nav>

    <div class="user-box">
        <span sec:authorize="isAuthenticated()">
            <b sec:authentication="name">guest</b>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit">Выйти</button>
            </form>
        </span>

        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Войти</a>

        <a th:href="@{/cart}">
            🛒 Корзина
            <span th:if="${session.cart != null && session.cart.itemCount > 0}"
                  th:text="'(' + ${session.cart.itemCount} + ')'"></span>
        </a>
    </div>
</header>

<main class="container">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <!-- Используем th:insert вместо th:replace для вставки фрагмента -->
    <div th:insert="${content}">Содержимое страницы</div>
</main>

<footer class="site-footer">
    © 2026 Магазин канцтоваров
</footer>

</body>
</html>
