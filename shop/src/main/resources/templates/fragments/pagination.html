<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="pager(page, url, categoryId, search, sort)"
     class="pagination" th:if="${page.totalPages > 1}">

  <a th:if="${page.hasPrevious()}"
     th:href="@{${url}(categoryId=${categoryId}, search=${search}, sort=${sort}, page=${page.number - 1})}">← Назад</a>

  <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
    <span th:if="${i == page.number}" class="current" th:text="${i + 1}"></span>
    <a th:unless="${i == page.number}"
       th:href="@{${url}(categoryId=${categoryId}, search=${search}, sort=${sort}, page=${i})}"
       th:text="${i + 1}"></a>
  </th:block>

  <a th:if="${page.hasNext()}"
     th:href="@{${url}(categoryId=${categoryId}, search=${search}, sort=${sort}, page=${page.number + 1})}">Вперёд →</a>
</div>

</body>
</html>
