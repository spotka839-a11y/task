<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Категории</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
        .error { color: red; margin-bottom: 10px; }
        .success { color: green; margin-bottom: 10px; }
    </style>
</head>
<body>
<h1>Категории</h1>

<div class="error" th:if="${error}" th:text="${error}"></div>
<div class="success" th:if="${success}" th:text="${success}"></div>

<table>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th th:if="${#authorization.expression('hasRole(''Админист'')')}"></th>
    </tr>
    <tr th:each="c : ${categories}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.title}"></td>
        <td th:if="${#authorization.expression('hasRole(''Админист'')')}">
            <form th:action="@{/admin/categories/delete/{id}(id=${c.id})}" method="post">
                <button type="submit" onclick="return confirm('Удалить категорию?')">Удалить</button>
            </form>
        </td>
    </tr>
</table>

<!-- Форма добавления видна только администратору -->
<form th:if="${#authorization.expression('hasRole(''Админист'')')}"
      th:action="@{/admin/categories/create}" method="post">
    <input type="text" name="title" placeholder="Название категории" required/>
    <button type="submit">Добавить</button>
</form>

<p><a th:href="@{/products-jpa-page}">К товарам</a></p>
</body>
</html>
